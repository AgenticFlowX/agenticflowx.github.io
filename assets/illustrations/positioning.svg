<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 700" font-family="Geist, -apple-system, sans-serif">
  <!-- generated illustration: where AFX sits — positioning quadrant -->
  <!-- highlighted winning zone: rich surface + two-way -->
  <rect x="530" y="130" width="380" height="238" rx="8" fill="rgba(160,126,57,0.07)"/>

  <!-- quadrant cross (faint) -->
  <line x1="530" y1="130" x2="530" y2="600" stroke="rgba(20,27,53,0.12)" stroke-dasharray="4 6"/>
  <line x1="140" y1="368" x2="910" y2="368" stroke="rgba(20,27,53,0.12)" stroke-dasharray="4 6"/>

  <!-- axes -->
  <line x1="140" y1="130" x2="140" y2="600" stroke="rgba(20,27,53,0.35)" stroke-width="1.4"/>
  <line x1="140" y1="600" x2="910" y2="600" stroke="rgba(20,27,53,0.35)" stroke-width="1.4"/>

  <!-- axis titles -->
  <text x="525" y="648" fill="#6b6450" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle" letter-spacing="1">HOW MUCH SURFACE  →</text>
  <text x="66" y="365" fill="#6b6450" font-family="ui-monospace, monospace" font-size="12" text-anchor="middle" letter-spacing="1" transform="rotate(-90 66 365)">CODE ↔ SPEC STAY LINKED  →</text>

  <!-- axis end labels -->
  <text x="150" y="626" fill="#8a8069" font-size="12">CLI only, no UI</text>
  <text x="900" y="626" fill="#8a8069" font-size="12" text-anchor="end">rich, in your editor</text>
  <text x="150" y="586" fill="#8a8069" font-size="12">one-way (write once)</text>
  <text x="150" y="150" fill="#8a8069" font-size="12">two-way (traceable)</text>

  <!-- plotted: CLI scaffolders (low surface, one-way) -->
  <circle cx="285" cy="486" r="8" fill="#a89e85"/>
  <text x="285" y="518" fill="#3d4256" font-size="14" text-anchor="middle">CLI scaffolders</text>
  <text x="285" y="538" fill="#8a8069" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">generate &amp; forget</text>

  <!-- Spec-first IDEs (rich surface, one-way, own editor) -->
  <circle cx="742" cy="486" r="8" fill="#a89e85"/>
  <text x="742" y="518" fill="#3d4256" font-size="14" text-anchor="middle">Spec-first IDEs</text>
  <text x="742" y="538" fill="#8a8069" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">a whole new editor</text>

  <!-- AFX (rich + two-way) -->
  <circle cx="762" cy="238" r="13" fill="#a07e39" stroke="#fffbed" stroke-width="2.5"/>
  <circle cx="762" cy="238" r="24" fill="none" stroke="#a07e39" stroke-opacity="0.4"/>
  <text x="762" y="200" fill="#141b35" font-family="Georgia, serif" font-size="20" font-weight="600" text-anchor="middle">AgenticFlowX</text>
  <text x="762" y="284" fill="#6e5724" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">rich surface + bidirectional</text>

  <!-- footnote -->
  <text x="530" y="682" fill="#8a8069" font-size="12.5" text-anchor="middle">…and it runs in the VS Code you already use — plus as skills in any agent. No new editor, no lock-in.</text>
</svg>
