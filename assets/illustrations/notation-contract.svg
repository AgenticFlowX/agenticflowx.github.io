<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Geist, -apple-system, sans-serif">
  <!-- generated illustration: the notation contract — stable anchors across the four files -->
  <defs>
    <marker id="nc-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a07e39"/></marker>
  </defs>

  <text x="40" y="42" fill="#a84c30" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1.5">THE CONTRACT — ONE ID, RESOLVED EVERYWHERE</text>

  <!-- spec -->
  <rect x="40" y="72" width="250" height="120" rx="12" fill="#fffbed" stroke="rgba(20,27,53,0.2)"/>
  <text x="64" y="102" fill="#6b6450" font-family="ui-monospace, monospace" font-size="11">spec.md</text>
  <text x="64" y="130" fill="#141b35" font-size="14">## Requirements</text>
  <rect x="64" y="146" width="88" height="28" rx="6" fill="rgba(74,110,90,0.1)" stroke="#4a6e5a"/>
  <text x="108" y="165" fill="#4a6e5a" font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">FR-1</text>
  <text x="160" y="165" fill="#6b6450" font-size="12">Export as CSV</text>

  <path d="M290 132 H 348" stroke="#a07e39" stroke-width="1.6" marker-end="url(#nc-a)"/>

  <!-- design -->
  <rect x="356" y="72" width="250" height="120" rx="12" fill="#fffbed" stroke="rgba(20,27,53,0.2)"/>
  <text x="380" y="102" fill="#6b6450" font-family="ui-monospace, monospace" font-size="11">design.md</text>
  <text x="380" y="130" fill="#141b35" font-size="14">## <tspan fill="#6e5724" font-family="ui-monospace, monospace" font-size="12.5">[DES-ARCH]</tspan></text>
  <text x="380" y="158" fill="#6b6450" font-size="12">Streaming writer</text>
  <text x="380" y="178" fill="#8a8069" font-family="ui-monospace, monospace" font-size="10.5">@see spec.md [FR-1]</text>

  <path d="M606 132 H 664" stroke="#a07e39" stroke-width="1.6" marker-end="url(#nc-a)"/>

  <!-- tasks -->
  <rect x="672" y="72" width="250" height="120" rx="12" fill="#fffbed" stroke="rgba(20,27,53,0.2)"/>
  <text x="696" y="102" fill="#6b6450" font-family="ui-monospace, monospace" font-size="11">tasks.md</text>
  <text x="696" y="130" fill="#141b35" font-size="14">### <tspan fill="#6e5724" font-family="ui-monospace, monospace" font-size="12.5">1.1</tspan> CSV writer</text>
  <text x="696" y="158" fill="#8a8069" font-family="ui-monospace, monospace" font-size="10.5">@see design.md [DES-ARCH]</text>
  <text x="696" y="176" fill="#8a8069" font-family="ui-monospace, monospace" font-size="10.5">     spec.md [FR-1]</text>

  <path d="M922 132 H 980" stroke="#a07e39" stroke-width="1.6" marker-end="url(#nc-a)"/>

  <!-- code -->
  <rect x="988" y="72" width="172" height="120" rx="12" fill="#0d0f16"/>
  <text x="1010" y="102" fill="#6c7488" font-family="ui-monospace, monospace" font-size="11">csv-writer.ts</text>
  <text x="1010" y="130" fill="#6c7488" font-family="ui-monospace, monospace" font-size="11">/**</text>
  <text x="1010" y="150" fill="#e0b872" font-family="ui-monospace, monospace" font-size="11"> * @see [FR-1]</text>
  <text x="1010" y="170" fill="#9ec9b0" font-family="ui-monospace, monospace" font-size="11"> * [DES-ARCH]</text>
  <text x="1010" y="186" fill="#6c7488" font-family="ui-monospace, monospace" font-size="11"> */</text>

  <!-- the point -->
  <line x1="40" y1="248" x2="1160" y2="248" stroke="rgba(20,27,53,0.12)" stroke-dasharray="4 6"/>
  <text x="600" y="298" fill="#141b35" font-family="Georgia, serif" font-size="22" font-style="italic" text-anchor="middle">Sections can move. The IDs don't.</text>
  <text x="600" y="334" fill="#3d4256" font-size="15" text-anchor="middle">Rename a heading, reorder the file, add a custom section — every <tspan fill="#6e5724" font-family="ui-monospace, monospace" font-size="13">@see [FR-1]</tspan> still resolves.</text>
  <text x="600" y="362" fill="#6b6450" font-size="14" text-anchor="middle">That stable anchor is the whole trick: it's what the CLI, the extension, and CodeLens parse against.</text>

  <rect x="380" y="388" width="440" height="34" rx="17" fill="rgba(160,126,57,0.08)" stroke="rgba(160,126,57,0.4)"/>
  <text x="600" y="410" fill="#6e5724" font-family="ui-monospace, monospace" font-size="12.5" text-anchor="middle">flexible sections · fixed anchors · deterministic parsing</text>
</svg>
