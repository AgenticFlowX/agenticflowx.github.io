<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" font-family="ui-monospace, 'JetBrains Mono', monospace">
  <!-- generated illustration: full four-file lifecycle with gates -->
  <rect width="1280" height="660" fill="#0d0f16"/>
  <defs>
    <marker id="lf-arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d4a656"/></marker>
  </defs>
  <text x="48" y="46" fill="#8a92a8" font-size="12" letter-spacing="2">THE FULL WORKFLOW — GATES AT EVERY BOUNDARY</text>

  <!-- lane 1: spec -->
  <rect x="48" y="76" width="1184" height="128" rx="12" fill="#12141d" stroke="#2a2f3e"/>
  <text x="76" y="108" fill="#ece7d8" font-size="15">spec.md <tspan fill="#6c7488" font-size="11"> — the WHAT · [FR-N] [NFR-N] anchors</tspan></text>
  <g font-size="12">
    <rect x="76" y="126" width="118" height="34" rx="8" fill="none" stroke="#2a2f3e"/><text x="135" y="148" fill="#9aa1b4" text-anchor="middle">create</text>
    <rect x="210" y="126" width="150" height="34" rx="8" fill="none" stroke="#2a2f3e"/><text x="285" y="148" fill="#9aa1b4" text-anchor="middle">refine (loop)</text>
    <rect x="376" y="126" width="196" height="34" rx="8" fill="none" stroke="#2a2f3e"/><text x="474" y="148" fill="#9aa1b4" text-anchor="middle">validate + review</text>
    <rect x="588" y="126" width="140" height="34" rx="8" fill="#d4a656"/><text x="658" y="148" fill="#14161e" text-anchor="middle" font-weight="600">approve</text>
    <text x="748" y="148" fill="#8fc9a3">Draft → Approved · spec frozen</text>
    <text x="76" y="188" fill="#6c7488" font-size="11">approve is BLOCKED while Critical review issues remain · editing an approved spec bumps version, demotes it and everything downstream</text>
  </g>
  <path d="M1080 204 v 18" stroke="#d4a656" stroke-width="1.8" marker-end="url(#lf-arr)"/>
  <text x="1096" y="220" fill="#d4a656" font-size="11">unlocks</text>

  <!-- lane 2: design -->
  <rect x="48" y="228" width="1184" height="120" rx="12" fill="#12141d" stroke="#2a2f3e"/>
  <text x="76" y="260" fill="#ece7d8" font-size="15">design.md <tspan fill="#6c7488" font-size="11"> — the HOW · every ## heading carries a [DES-ID]</tspan></text>
  <g font-size="12">
    <rect x="76" y="278" width="180" height="34" rx="8" fill="none" stroke="#2a2f3e"/><text x="166" y="300" fill="#9aa1b4" text-anchor="middle">author · refine</text>
    <text x="266" y="300" fill="#6c7488" font-size="11">← BLOCKED until spec is Approved</text>
    <rect x="520" y="278" width="196" height="34" rx="8" fill="none" stroke="#2a2f3e"/><text x="618" y="300" fill="#9aa1b4" text-anchor="middle">validate + review</text>
    <rect x="732" y="278" width="140" height="34" rx="8" fill="#d4a656"/><text x="802" y="300" fill="#14161e" text-anchor="middle" font-weight="600">approve</text>
    <text x="892" y="300" fill="#8fc9a3">→ "/afx-task plan UNLOCKED"</text>
  </g>
  <path d="M1080 348 v 18" stroke="#d4a656" stroke-width="1.8" marker-end="url(#lf-arr)"/>
  <text x="1096" y="364" fill="#d4a656" font-size="11">unlocks</text>

  <!-- lane 3: tasks loop -->
  <rect x="48" y="372" width="1184" height="180" rx="12" fill="#12141d" stroke="#2a2f3e"/>
  <text x="76" y="404" fill="#ece7d8" font-size="15">tasks.md <tspan fill="#6c7488" font-size="11"> — the WHEN · ### N.N task IDs · the working loop</tspan></text>
  <g font-size="12">
    <rect x="76" y="424" width="104" height="34" rx="8" fill="none" stroke="#2a2f3e"/><text x="128" y="446" fill="#9aa1b4" text-anchor="middle">plan</text>
    <path d="M180 441 h 22" stroke="#8a92a8" stroke-width="1.4" marker-end="url(#lf-arr)"/>
    <rect x="208" y="424" width="104" height="34" rx="8" fill="none" stroke="#2a2f3e"/><text x="260" y="446" fill="#9aa1b4" text-anchor="middle">pick</text>
    <path d="M312 441 h 22" stroke="#8a92a8" stroke-width="1.4" marker-end="url(#lf-arr)"/>
    <rect x="340" y="424" width="104" height="34" rx="8" fill="#1a1f2e" stroke="#d4a656"/><text x="392" y="446" fill="#e0b872" text-anchor="middle">code</text>
    <path d="M444 441 h 22" stroke="#8a92a8" stroke-width="1.4" marker-end="url(#lf-arr)"/>
    <rect x="472" y="424" width="112" height="34" rx="8" fill="none" stroke="#2a2f3e"/><text x="528" y="446" fill="#9aa1b4" text-anchor="middle">verify</text>
    <path d="M584 441 h 22" stroke="#8a92a8" stroke-width="1.4" marker-end="url(#lf-arr)"/>
    <rect x="612" y="424" width="128" height="34" rx="8" fill="none" stroke="#2a2f3e"/><text x="676" y="446" fill="#9aa1b4" text-anchor="middle">complete</text>
    <path d="M740 441 h 30" stroke="#8a92a8" stroke-width="1.4" marker-end="url(#lf-arr)"/>
    <text x="778" y="446" fill="#6c7488">next task → next phase</text>

    <text x="76" y="496" fill="#6c7488" font-size="11.5">verify routes on evidence:</text>
    <text x="266" y="496" fill="#8fc9a3">[OK] → mark complete?</text>
    <text x="448" y="496" fill="#e0b872">[PARTIAL] → continue coding?</text>
    <text x="682" y="496" fill="#d4693f">[MISSING] → start coding?</text>
    <text x="76" y="524" fill="#6c7488" font-size="11.5">evidence per task: files exist · @see backlinks · session log — two-stage sign-off: Agent [x] and Human [x]</text>
  </g>

  <!-- journal rail -->
  <rect x="48" y="576" width="1184" height="56" rx="12" fill="#12141d" stroke="#4a6e5a"/>
  <text x="76" y="610" fill="#6fa989" font-size="13">journal.md <tspan fill="#9aa1b4" font-size="12"> — append-only, alongside every stage: decisions, discussions, session logs. The reason any agent can resume.</tspan></text>
</svg>
