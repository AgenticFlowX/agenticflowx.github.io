<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" font-family="ui-monospace, 'JetBrains Mono', monospace">
  <!-- generated illustration: how Pi loads skills (per pi-mono docs/skills.md) -->
  <rect width="1280" height="700" fill="#0d0f16"/>
  <text x="48" y="52" fill="#8a92a8" font-size="13" letter-spacing="2">HOW SKILLS LOAD · AGENT SKILLS STANDARD</text>

  <!-- left column: locations -->
  <text x="48" y="108" fill="#ece7d8" font-size="17" font-family="Georgia, serif">Where Pi looks</text>

  <g font-size="13">
    <rect x="48" y="130" width="560" height="64" rx="9" fill="#12141d" stroke="#2a2f3e"/>
    <text x="70" y="157" fill="#d4a656">GLOBAL</text>
    <text x="70" y="180" fill="#9aa1b4">~/.pi/agent/skills/ · ~/.agents/skills/</text>

    <rect x="48" y="206" width="560" height="64" rx="9" fill="#12141d" stroke="#2a2f3e"/>
    <text x="70" y="233" fill="#d4a656">PROJECT</text>
    <text x="70" y="256" fill="#9aa1b4">.pi/skills/ · .agents/skills/ (cwd + ancestors to git root)</text>

    <rect x="48" y="282" width="560" height="64" rx="9" fill="#12141d" stroke="#2a2f3e"/>
    <text x="70" y="309" fill="#d4a656">PACKAGES</text>
    <text x="70" y="332" fill="#9aa1b4">skills/ dirs · "pi.skills" entries in package.json</text>

    <rect x="48" y="358" width="560" height="64" rx="9" fill="#12141d" stroke="#2a2f3e"/>
    <text x="70" y="385" fill="#d4a656">SETTINGS</text>
    <text x="70" y="408" fill="#9aa1b4">"skills": ["~/.claude/skills", "~/.codex/skills"]</text>

    <rect x="48" y="434" width="560" height="64" rx="9" fill="#12141d" stroke="#2a2f3e"/>
    <text x="70" y="461" fill="#d4a656">CLI</text>
    <text x="70" y="484" fill="#9aa1b4">--skill &lt;path&gt; (repeatable · additive with --no-skills)</text>
  </g>

  <text x="48" y="548" fill="#6c7488" font-size="12">Discovery: any directory containing SKILL.md, found recursively.</text>
  <text x="48" y="574" fill="#6c7488" font-size="12">Collisions keep the first skill found · missing description = not loaded.</text>

  <!-- arrow -->
  <path d="M636 340 h44" stroke="#4a5065" stroke-width="2"/>
  <path d="M680 340 l-10 -7 m10 7 l-10 7" stroke="#4a5065" stroke-width="2" fill="none"/>

  <!-- right column: progressive disclosure -->
  <text x="712" y="108" fill="#ece7d8" font-size="17" font-family="Georgia, serif">Progressive disclosure</text>

  <g font-size="13">
    <rect x="712" y="130" width="520" height="96" rx="9" fill="#12141d" stroke="#4a6e5a"/>
    <text x="734" y="160" fill="#6fa989">1 · STARTUP</text>
    <text x="734" y="184" fill="#9aa1b4">Pi scans all locations, puts only each skill's</text>
    <text x="734" y="206" fill="#9aa1b4">name + description into the system prompt.</text>

    <rect x="712" y="242" width="520" height="96" rx="9" fill="#12141d" stroke="#4a6e5a"/>
    <text x="734" y="272" fill="#6fa989">2 · ON MATCH</text>
    <text x="734" y="296" fill="#9aa1b4">When a task fits, the agent reads the full</text>
    <text x="734" y="318" fill="#9aa1b4">SKILL.md — instructions, scripts, references.</text>

    <rect x="712" y="354" width="520" height="96" rx="9" fill="#12141d" stroke="#4a6e5a"/>
    <text x="734" y="384" fill="#6fa989">3 · ON DEMAND</text>
    <text x="734" y="408" fill="#9aa1b4">/skill:afx-next forces a load — arguments</text>
    <text x="734" y="430" fill="#9aa1b4">are appended to the skill content.</text>
  </g>

  <rect x="712" y="482" width="520" height="88" rx="9" fill="#12141d" stroke="#a07e39"/>
  <text x="734" y="512" fill="#d4a656" font-size="12" letter-spacing="1">WHY IT'S CHEAP</text>
  <text x="734" y="536" fill="#9aa1b4" font-size="13">Descriptions cost a few tokens per session.</text>
  <text x="734" y="558" fill="#9aa1b4" font-size="13">Full instructions load only when actually used.</text>

  <text x="712" y="614" fill="#6c7488" font-size="12">AFX's 18 core skills ride this exact mechanism — as does any skill you add.</text>
</svg>
